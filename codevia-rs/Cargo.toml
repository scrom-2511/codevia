[package]
name = "codevia-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
strum = "0.28.0"
thiserror = "2.0.21"
tokio = { version = "1.32.0", features = ["full"] }
redis = { version = "1.0.4", features = ["tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
futures-util = "0.3.34"
async-stream = "0.3.6"
dotenvy = "0.15.7"
futures = "0.3.34"